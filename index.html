<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Przewodnik Audio: Bolonia</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  
  <style>
    :root {
      --primary: #c2410c;
      --primary-hover: #9a3412;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Widok 1: Strona powitalna ze wstępem */
    #intro-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(circle at top, #331d16 0%, #0f172a 75%);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(194, 65, 12, 0.2);
      color: #ea580c;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
      border: 1px solid rgba(234, 88, 12, 0.3);
    }

    h1 {
      font-size: 2.2rem;
      line-height: 1.2;
      margin-bottom: 12px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .player-card {
      width: 100%;
      max-width: 420px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
      margin-bottom: 28px;
    }

    .player-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .player-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      outline: none;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 420px;
      padding: 16px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(194, 65, 12, 0.4);
      transition: all 0.2s ease;
    }

    .btn-action:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .btn-skip {
      margin-top: 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Widok 2: Interaktywna mapa i panel przystanków */
    #map-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }

    .stop-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 20px 20px 28px 20px;
      z-index: 1000;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }

    .stop-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .stop-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #ea580c;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .stop-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
      max-width: 80%;
    }

    .step-counter {
      background: #334155;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .milan-banner {
      display: none;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      padding: 16px 20px;
      border-radius: 14px;
      text-align: center;
      font-weight: 800;
      font-size: 1.1rem;
      margin-top: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* Style znaczników mapy */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: white;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 2px solid white;
      transition: all 0.3s;
    }

    .marker-locked {
      background: #475569 !important;
      opacity: 0.6;
    }

    .marker-active {
      background: #c2410c !important;
      transform: scale(1.15);
      animation: bounce 1s infinite alternate;
    }

    .marker-completed {
      background: #16a34a !important;
    }

    @keyframes bounce {
      from { transform: translateY(0) scale(1.15); }
      to { transform: translateY(-4px) scale(1.15); }
    }
  </style>
</head>
<body>

  <!-- Widok 1: Wstęp do wycieczki -->
  <div id="intro-screen">
    <div class="badge">Włochy 2026 • Etap 1</div>
    <h1>Bolonia</h1>
    <p class="subtitle">Wprowadzenie do miasta czerwonych portyków, smaku i najstarszego uniwersytetu.</p>

    <div class="player-card">
      <div class="player-title">Wstęp do Bolonii</div>
      <div class="player-desc">Odsłuchaj nagranie wprowadzające, aby odblokować mapę spaceru</div>
      <audio id="intro-audio" controls>
        <source src="Bolonia wstep.mp3" type="audio/mpeg">
        Twoja przeglądarka nie obsługuje dźwięku.
      </audio>
    </div>

    <button id="btn-start-map" class="btn-action" disabled>
      <span>Otwórz mapę zwiedzania</span>
      <span>🔒</span>
    </button>
    <button id="btn-skip-intro" class="btn-skip">Pomiń wstęp (odblokuj ręcznie)</button>
  </div>

  <!-- Widok 2: Interaktywna mapa ze spacerem -->
  <div id="map-screen">
    <div id="map"></div>

    <div class="stop-panel">
      <div class="stop-header">
        <div>
          <div class="stop-badge" id="panel-badge">Aktualny cel</div>
          <div class="stop-title" id="panel-title">Wybierz przystanek</div>
        </div>
        <div class="step-counter" id="panel-counter">1 / 10</div>
      </div>

      <audio id="stop-audio" controls style="margin-bottom: 6px;">
        <source id="stop-audio-source" src="" type="audio/mpeg">
      </audio>

      <!-- Przycisk Mediolanu po odsłuchaniu całości -->
      <div id="btn-milan" class="milan-banner">
        ➔ Gratulacje! Kolejny cel: MEDIOLAN
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 10 Przystanków w Bolonii
    const stops = [
      {
        id: 1,
        title: "Wzgórze z widokiem",
        coords: [44.4815, 11.3413],
        file: "PRZYSTANEK 1 Wzgórze z widokiem.mp3"
      },
      {
        id: 2,
        title: "Poranek na Via Castiglione i Piekarnia Forno Brisa",
        coords: [44.4891, 11.3465],
        file: "PRZYSTANEK 2 Poranek na Via Castiglione i Piekarnia Forno Brisa.mp3"
      },
      {
        id: 3,
        title: "Palazzo dell’Archiginnasio – Śladami Polaków",
        coords: [44.4920, 11.3436],
        file: "PRZYSTANEK 3 Palazzo dell’Archiginnasio – Śladami Polaków i Teatr Ludzkiego Ciała.mp3"
      },
      {
        id: 4,
        title: "Piazza Maggiore i Urząd Miasta",
        coords: [44.4938, 11.3429],
        file: "PRZYSTANEK 4 Piazza Maggiore i Urząd Miasta – Polityka, Kościół i Sekrety Władzy.mp3"
      },
      {
        id: 5,
        title: "Fontanna Neptuna i Średniowieczny Telefon",
        coords: [44.4942, 11.3431],
        file: "PRZYSTANEK 5 Fontanna Neptuna i Średniowieczny Telefon Bezprzewodowy.mp3"
      },
      {
        id: 6,
        title: "Le Due Torri (Dwie Wieże) – Manhattan",
        coords: [44.4943, 11.3466],
        file: "PRZYSTANEK 6 Le Due Torri (Dwie Wieże) – Średniowieczny Manhattan.mp3"
      },
      {
        id: 7,
        title: "Mò Mortadella Lab – Hołd dla Emilii",
        coords: [44.4981, 11.3444],
        file: "PRZYSTANEK 7 Mò Mortadella Lab – Hołd dla Królowej Emilii.mp3"
      },
      {
        id: 8,
        title: "Finestrella di Via Piella – Podziemna Wenecja",
        coords: [44.4996, 11.3449],
        file: "PRZYSTANEK 8 Finestrella di Via Piella – Podziemna Wenecja.mp3"
      },
      {
        id: 9,
        title: "Park Montagnola i Schody Pincio",
        coords: [44.5011, 11.3457],
        file: "PRZYSTANEK 9 Park Montagnola i Schody Pincio – Od Zamku Papieży do Napoleona.mp3"
      },
      {
        id: 10,
        title: "Bologna Centrale – Zegar, który zatrzymał czas",
        coords: [44.5058, 11.3433],
        file: "PRZYSTANEK 10 Bologna Centrale – Zegar, który zatrzymał czas.mp3"
      }
    ];

    let unlockedUpTo = 1;
    let currentSelected = 1;
    let markers = [];
    let map = null;

    const introAudio = document.getElementById('intro-audio');
    const btnStartMap = document.getElementById('btn-start-map');
    const btnSkipIntro = document.getElementById('btn-skip-intro');
    const introScreen = document.getElementById('intro-screen');
    const mapScreen = document.getElementById('map-screen');

    const panelBadge = document.getElementById('panel-badge');
    const panelTitle = document.getElementById('panel-title');
    const panelCounter = document.getElementById('panel-counter');
    const stopAudio = document.getElementById('stop-audio');
    const stopAudioSource = document.getElementById('stop-audio-source');
    const btnMilan = document.getElementById('btn-milan');

    introAudio.addEventListener('ended', enableMapButton);
    btnSkipIntro.addEventListener('click', enableMapButton);

    function enableMapButton() {
      btnStartMap.removeAttribute('disabled');
      btnStartMap.innerHTML = "<span>Rozpocznij spacer</span> ➔";
    }

    btnStartMap.addEventListener('click', () => {
      introScreen.style.display = 'none';
      mapScreen.style.display = 'flex';
      initMap();
    });

    function initMap() {
      if (map) return;

      map = L.map('map').setView([44.4938, 11.3436], 14);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      const pathCoords = stops.map(s => s.coords);
      L.polyline(pathCoords, {
        color: '#c2410c',
        weight: 4,
        dashArray: '6, 8',
        opacity: 0.8
      }).addTo(map);

      stops.forEach((stop) => {
        const markerEl = document.createElement('div');
        markerEl.className = 'custom-marker';
        markerEl.id = `marker-${stop.id}`;
        markerEl.innerText = stop.id;

        const icon = L.divIcon({
          html: markerEl,
          className: '',
          iconSize: [28, 28]
        });

        const marker = L.marker(stop.coords, { icon: icon }).addTo(map);
        marker.on('click', () => {
          if (stop.id <= unlockedUpTo) {
            selectStop(stop.id);
          } else {
            alert(`🔒 Ten punkt jest jeszcze zablokowany! Wysłuchaj najpierw punktu ${unlockedUpTo}.`);
          }
        });

        markers.push(marker);
      });

      updateMarkersUI();
      selectStop(1);
    }

    function selectStop(id) {
      currentSelected = id;
      const stop = stops.find(s => s.id === id);

      panelTitle.innerText = `${stop.id}. ${stop.title}`;
      panelCounter.innerText = `${stop.id} / ${stops.length}`;
      panelBadge.innerText = id < unlockedUpTo ? "Odsłuchane" : "Aktualny cel";

      stopAudioSource.src = stop.file;
      stopAudio.load();
      map.panTo(stop.coords, { animate: true, duration: 0.8 });

      updateMarkersUI();
    }

    function updateMarkersUI() {
      stops.forEach((s) => {
        const el = document.getElementById(`marker-${s.id}`);
        if (!el) return;

        el.className = 'custom-marker';

        if (s.id === currentSelected) {
          el.classList.add('marker-active');
        } else if (s.id < unlockedUpTo) {
          el.classList.add('marker-completed');
        } else if (s.id === unlockedUpTo) {
          el.classList.add('marker-active');
        } else {
          el.classList.add('marker-locked');
        }
      });
    }

    stopAudio.addEventListener('ended', () => {
      if (currentSelected === unlockedUpTo && unlockedUpTo < stops.length) {
        unlockedUpTo++;
        selectStop(unlockedUpTo);
      } else if (unlockedUpTo === stops.length) {
        btnMilan.style.display = 'block';
        btnMilan.scrollIntoView({ behavior: 'smooth' });
      }
    });

    btnMilan.addEventListener('click', () => {
      alert("Rozpoczynamy przygotowanie etapu Mediolan!");
    });
  </script>
</body>
</html>
